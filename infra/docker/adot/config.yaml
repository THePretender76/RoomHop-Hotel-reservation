extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 128
    send_batch_max_size: 256

exporters:
  awsxray:
    region: ${env:AWS_REGION}
    local_mode: true
    request_timeout_seconds: 5
    max_retries: 2
    telemetry:
      enabled: false

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awsxray]
