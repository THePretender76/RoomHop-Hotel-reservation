# =====================================================================
# TRINO HIVE CONNECTOR — reads Parquet from MinIO
#
# HOW TRINO DISCOVERS DATA:
# 1. Trino uses the Hive connector to read data from S3-compatible storage
# 2. It connects to MinIO using the S3 API endpoint
# 3. The file-based catalog (or Hive Metastore) tells Trino:
#    - Which tables exist
#    - Column names and types
#    - Partition layout (year/month)
# 4. Trino reads only the Parquet columns needed (column pruning)
# 5. Predicate pushdown: Trino skips row groups where min/max stats
#    indicate no matching rows
# 6. Trino NEVER stores data — it's a pure compute engine
# =====================================================================
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3a://hotel-analytic-roomhop-76700/
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=miniopassword
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false
